name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run tests
      run: |
        npm start > server.log 2>&1 &
        sleep 5
        npm test
